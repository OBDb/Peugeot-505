generations:
  - name: "First Generation (Pre-Facelift)"
    start_year: 1979
    end_year: 1985
    description: "The Peugeot 505 was introduced as a replacement for the successful 504, officially unveiled on May 16, 1979. Designed by Pininfarina in collaboration with Peugeot's internal styling department, featuring clean, elegant lines that would age remarkably well throughout its long production run. Available as a four-door sedan with the station wagon (Break) and eight-passenger Familiale version introduced at the 1982 Geneva Motor Show. The front-engine, rear-wheel-drive layout differentiated the 505 from many marketplace competitors. Early models featured MacPherson struts at front and semi-trailing arms at rear, with station wagons using a live-axle rear suspension. Initial engine offerings included the 1.8L XM7 and 2.0L XN1 gasoline engines with carburetor or fuel injection, along with the 2.3L XD2 diesel inherited from the 504. The interior designed by Paul Bracq emphasized comfort with supportive seats and logical control layout. Right-hand drive became available from October 1979 for RHD markets. The 505 was praised by contemporary journalists for its ride and handling, especially on rough roads, contributing to its popularity in less developed countries. Dangel offered a four-wheel drive version of the Break with turbodiesel or 2.2L petrol engines."
  - name: "First Generation (Facelift)"
    start_year: 1986
    end_year: 1992
    description: "The 505 received a significant facelift in 1986, featuring an all-new interior while maintaining the proven rear-wheel drive platform. The estate/wagon model continued production until 1992, while sedan production ended in 1989 with the launch of the new Peugeot 605 flagship. The V6 model using the 2.8-liter PRV engine was added during 1986, priced identically to the 505 Turbo but targeting a different clientele. The Turbo models received increased power to 130 PS thanks to an intercooler and slight boost increase, with ABS brakes also added. The 505 STI introduced the new 2165cc Douvrin engine developed with Renault. The turbodiesel XD3T and XD3TE with intercooler became available from 1985 onwards. North American markets received unique body styling with different headlamps, taillights, and bumpers, with turbocharged station wagons unique to the US. The 505 was one of the last Peugeot models sold in the United States, with sedan sales ending in 1990 and wagon sales in 1991. In Argentina, production continued until 1995 by Sevel. The 505 became one of Peugeot's most globally successful models, with over 1.3 million units produced between 1978 and 1992."
